<!DOCTYPE html><html><head><meta charset="utf-8"></head><body style="background:#0a0e1a;color:#f2b705;text-align:center;padding-top:40vh">🧹<script>function done(){location.replace("/user-login?clean=1");}if("serviceWorker" in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister();}));}).then(function(){return caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k);}));});}).then(done).catch(done);}else{done();}</script></body></html>
